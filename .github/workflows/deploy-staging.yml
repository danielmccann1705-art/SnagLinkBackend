name: Deploy to Staging (Hetzner, retired)

# RETIRED 27 September 2026 (audit F23). Kept for its history, not run.
#
# This used to build a `:staging` image to GHCR and restart the staging stack on
# the Hetzner VPS on every push to a `staging` branch. Staging now runs on the
# Cloudflare Worker `snaglist-api-unified-staging` and is promoted by pinned
# image digest (`Infrastructure/cloudflare/README.md`). A push to a branch named
# `staging` must not rebuild and restart a retired server, so the push trigger
# is removed. Delete this file once the VPS and its secrets are decommissioned.
on:
  workflow_dispatch:

jobs:
  retired:
    name: Retired Hetzner staging deploy (does nothing)
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "This workflow is retired. Staging deploys to Cloudflare from Infrastructure/cloudflare."
          echo "No image is pushed and no SSH connection is made."
