name: Build Docker image (manual check)

# Changed 27 September 2026 (audit F23). This used to build and push
# ghcr.io/<repo>:latest on every push to `main`, and a successful run then
# triggered the Hetzner deploy (now retired, see deploy.yml). Nothing uses the
# GHCR image any more: staging and production run on Cloudflare from an image
# built from a reviewed commit export and pushed to the Cloudflare registry by
# digest (`Infrastructure/cloudflare/scripts/prepare-build.mjs`).
#
# It is kept as a manual, build-only check of the Dockerfile: it runs only when
# started by hand, pushes nothing and needs no package-write permission. The
# supported local entry point is `scripts/verify.sh`.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
