name: Deploy to Hetzner (retired)

# RETIRED 27 September 2026 (audit F23). Kept for its history, not run.
#
# The backend no longer runs on the Hetzner VPS. Staging and production run on
# Cloudflare Workers + Containers from `Infrastructure/cloudflare`, deployed by
# pinned image digest through the reviewed promotion jobs (see
# `Infrastructure/cloudflare/README.md` and `scripts/verify.sh`).
#
# Before this change the workflow ran automatically after every successful
# "Build and Push Docker Image" run on `main` and replaced the app on the VPS
# over SSH. Its last runs were in March 2026 (last success 22 March, last
# attempt 30 March, skipped). `feature/unified-platform` has not been merged,
# so nothing has triggered it since; merging it would have. The automatic
# trigger is therefore removed here, in the branch that will be merged, rather
# than left to be noticed afterwards.
#
# It is not deleted: the SSH secrets it names (HETZNER_HOST, HETZNER_SSH_KEY)
# and the VPS itself should be decommissioned deliberately first. Delete this
# file once the owner confirms the VPS and those secrets are gone.
on:
  workflow_dispatch:

jobs:
  retired:
    name: Retired Hetzner deploy (does nothing)
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "This workflow is retired. The backend deploys to Cloudflare from Infrastructure/cloudflare."
          echo "No SSH connection is made and nothing is deployed."
