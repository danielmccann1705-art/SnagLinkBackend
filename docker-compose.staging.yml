name: snaglist-staging

# Staging stack — runs alongside the production stack on the same Hetzner VPS, fully isolated:
#   * separate compose project name (snaglist-staging) → separate network + container names
#   * separate Postgres volume (pgdata_staging) → no shared data with prod
#   * app bound to 127.0.0.1:8081 (prod is :8080) → Cloudflare routes staging-api.snaglist.dev here
# Image is the :staging tag pushed by .github/workflows/deploy-staging.yml.

services:
  app:
    image: ghcr.io/danielmccann1705-art/snaglinkbackend:${IMAGE_TAG:-staging}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env.staging
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    # No port mapping — only reachable on the staging compose network.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snaglist_staging}
      POSTGRES_USER: ${POSTGRES_USER:-snaglist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata_staging:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=30
        -c shared_buffers=128MB
        -c effective_cache_size=512MB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snaglist}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_staging:
